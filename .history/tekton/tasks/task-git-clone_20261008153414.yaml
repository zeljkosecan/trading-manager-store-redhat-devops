---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: ze1se1-dev
spec:
  params:
  - name: repo-secret-name
    type: string
    default: github-combined
  - name: revision
    type: string
    default: main
  results:
  - name: commit
    type: string
  workspaces:
  - name: output
  steps:
  - name: clone
    image: registry.access.redhat.com/ubi9/git
    env:
    - name: github-tekton
      valueFrom:
        secretKeyRef:
          name: $(params.repo-secret-name)
          key: GITHUB_URL
    script: |
      set -e
      git clone "${GITHUB_URL}" "$(workspaces.output.path)"
      cd "$(workspaces.output.path)"
      git checkout "$(params.revision)"
      git rev-parse HEAD > "$(results.commit.path)"

