apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: ze1se1-dev
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  results:
    - name: commit
      type: string
  workspaces:
    - name: output
  steps:
    - name: clone
      image: registry.access.redhat.com/ubi9/git
      script: |
        set -e
        git clone "$(params.url)" "$(workspaces.output.path)"
        cd "$(workspaces.output.path)"
        git checkout "$(params.revision)"
        git rev-parse HEAD > "$(results.commit.path)"
