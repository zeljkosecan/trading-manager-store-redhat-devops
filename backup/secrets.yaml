apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ze1se1-dev
type: Opaque
stringData:
  POSTGRES_DB: trading-manager-store-1
  POSTGRES_USER: trading-manager
  POSTGRES_PASSWORD: samplepass123
  POSTGRES_HOST: postgres          # service name in-cluster
  POSTGRES_PORT: "5432"
