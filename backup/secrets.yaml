apiVersion: v1
kind: Secret
metadata:
  name: github-tekton
  namespace: ze1se1-dev
type: Opaque
stringData:
  GIT_URL: xxx
---
apiVersion: v1
kind: Secret
metadata:
  name: github-combined
  namespace: ze1se1-dev
type: Opaque
stringData:
  GIT_URL_WITH_TOKEN: https://<TOKEN>@github.com/my-org/my-repo.git
---
apiVersion: v1
kind: Secret
metadata:
  name: github-access
  namespace: ze1se1-dev
type: Opaque
stringData:
  GITHUB_URL: https://github.com/my-org/my-repo.git
  GITHUB_TOKEN: <YOUR_GITHUB_TOKEN_HERE>